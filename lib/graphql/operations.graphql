query ChainIdentifier {
  chainIdentifier
}

query GetDefaultNameServiceName($address: SuiAddress!) {
  address(address: $address) {
    defaultNameRecord {
      domain
    }
  }
}

query GetTransaction(
  $digest: String!
  $includeEffects: Boolean = false
  $includeEvents: Boolean = false
  $includeBalanceChanges: Boolean = false
  $includeEffectsJson: Boolean = false
  $includeBcs: Boolean = false
) {
  transaction(digest: $digest) {
    ...CoreTransactionFields
  }
}

fragment CoreTransactionFields on Transaction {
  digest
  transactionBcs @include(if: $includeBcs)
  signatures {
    signatureBytes
  }
  effects {
    status
    timestamp
    checkpoint {
      sequenceNumber
    }
    epoch {
      epochId
    }
    executionError {
      message
      abortCode
      sourceLineNumber
      instructionOffset
      identifier
      constant
      module {
        name
        package {
          address
        }
      }
      function {
        name
      }
    }
    effectsBcs @include(if: $includeEffects)
    effectsJson @include(if: $includeEffectsJson)
    balanceChanges(first: 50) @include(if: $includeBalanceChanges) {
      ...CoreBalanceChangePage
    }
    events(first: 50) @include(if: $includeEvents) {
      ...CoreEventPage
    }
  }
}

fragment CoreBalanceChangePage on BalanceChangeConnection {
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    owner {
      address
    }
    coinType {
      repr
    }
    amount
  }
}

fragment CoreEventPage on EventConnection {
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    sender {
      address
    }
    transactionModule {
      name
      package {
        address
      }
    }
    contents {
      type {
        repr
      }
      json
      bcs
    }
  }
}

query GetTransactionBalanceChanges($digest: String!, $after: String) {
  transaction(digest: $digest) {
    effects {
      balanceChanges(first: 50, after: $after) {
        ...CoreBalanceChangePage
      }
    }
  }
}

query GetTransactionEvents($digest: String!, $after: String) {
  transaction(digest: $digest) {
    effects {
      events(first: 50, after: $after) {
        ...CoreEventPage
      }
    }
  }
}

query GetMoveFunction($package: SuiAddress!, $module: String!, $function: String!) {
  package(address: $package) {
    module(name: $module) {
      function(name: $function) {
        name
        isEntry
        visibility
        typeParameters {
          constraints
        }
        parameters {
          signature
        }
        return {
          signature
        }
      }
    }
  }
}

query SimulateTransaction(
  $tx: JSON!
  $checksEnabled: Boolean
  $doGasSelection: Boolean
  $includeEffects: Boolean = false
  $includeEvents: Boolean = false
  $includeBalanceChanges: Boolean = false
  $includeEffectsJson: Boolean = false
  $includeBcs: Boolean = false
) {
  simulateTransaction(transaction: $tx, checksEnabled: $checksEnabled, doGasSelection: $doGasSelection) {
    effects {
      transaction {
        ...CoreTransactionFields
        effects {
          gasEffects {
            gasObject {
              address
            }
          }
        }
      }
    }
    outputs {
      returnValues {
        value {
          bcs
        }
      }
      mutatedReferences {
        value {
          bcs
        }
      }
    }
  }
}

query GetCoinMetadata($coinType: String!) {
  coinMetadata(coinType: $coinType) {
    address
    decimals
    name
    symbol
    description
    iconUrl
  }
}

query GetEpoch {
  epoch {
    epochId
    referenceGasPrice
    startTimestamp
  }
}

query GetDynamicFields(
  $parentId: SuiAddress!
  $first: Int
  $after: String
  $includeValue: Boolean = false
) {
  address(address: $parentId) {
    dynamicFields(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        address
        name {
          type {
            repr
          }
          bcs
        }
        value {
          __typename
          ... on MoveObject {
            address
            contents {
              type {
                repr
              }
            }
          }
          ... on MoveValue {
            type {
              repr
            }
            bcs @include(if: $includeValue)
          }
        }
      }
    }
  }
}

fragment CoreOwnerFields on Owner {
  __typename
  ... on AddressOwner {
    address {
      address
    }
  }
  ... on ObjectOwner {
    address {
      address
    }
  }
  ... on Shared {
    initialSharedVersion
  }
  ... on ConsensusAddressOwner {
    address {
      address
    }
    startVersion
  }
}

query GetOwnedObjects(
  $address: SuiAddress!
  $type: String
  $first: Int
  $after: String
  $includeContent: Boolean = false
  $includePreviousTransaction: Boolean = false
  $includeObjectBcs: Boolean = false
  $includeDisplay: Boolean = false
) {
  address(address: $address) {
    objects(first: $first, after: $after, filter: {type: $type}) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        address
        version
        digest
        owner {
          ...CoreOwnerFields
        }
        objectBcs @include(if: $includeObjectBcs)
        previousTransaction @include(if: $includePreviousTransaction) {
          digest
        }
        contents {
          ...CoreObjectContents
        }
      }
    }
  }
}

# json is always read: coins and existing callers rely on it
fragment CoreObjectContents on MoveValue {
  type {
    repr
  }
  json
  bcs @include(if: $includeContent)
  display @include(if: $includeDisplay) {
    output
  }
}

query MultiGetObjects(
  $keys: [ObjectKey!]!
  $includeContent: Boolean = false
  $includePreviousTransaction: Boolean = false
  $includeObjectBcs: Boolean = false
  $includeDisplay: Boolean = false
) {
  multiGetObjects(keys: $keys) {
    address
    version
    digest
    owner {
      ...CoreOwnerFields
    }
    objectBcs @include(if: $includeObjectBcs)
    previousTransaction @include(if: $includePreviousTransaction) {
      digest
    }
    asMoveObject {
      contents {
        ...CoreObjectContents
      }
    }
    asMovePackage {
      address
    }
  }
}

fragment CoreBalanceFields on Balance {
  coinType {
    repr
  }
  totalBalance
  coinBalance
  addressBalance
}

query GetBalance($address: SuiAddress!, $coinType: String!) {
  address(address: $address) {
    balance(coinType: $coinType) {
      ...CoreBalanceFields
    }
  }
}

query GetAllBalances($address: SuiAddress!, $first: Int, $after: String) {
  address(address: $address) {
    balances(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...CoreBalanceFields
      }
    }
  }
}

fragment TransactionHistoryFields on Transaction {
  digest
  sender {
    address
  }
  kind {
    __typename
    ... on ProgrammableTransaction {
      commands(first: 50) {
        pageInfo {
          hasNextPage
        }
        nodes {
          __typename
          ... on MoveCallCommand {
            function {
              name
              fullyQualifiedName
            }
          }
        }
      }
    }
  }
  effects {
    timestamp
    status
    gasEffects {
      gasSummary {
        computationCost
        storageCost
        storageRebate
      }
    }
    balanceChanges(first: 50) @include(if: $showBalanceChanges) {
      pageInfo {
        hasNextPage
      }
      nodes {
        amount
        coinType {
          repr
        }
        owner {
          address
        }
      }
    }
    objectChanges(first: 50) @include(if: $showObjectChanges) {
      pageInfo {
        hasNextPage
      }
      nodes {
        address
        idCreated
        idDeleted
        inputState {
          owner {
            __typename
            ... on AddressOwner {
              address {
                address
              }
            }
          }
        }
        outputState {
          owner {
            __typename
            ... on AddressOwner {
              address {
                address
              }
            }
          }
          asMoveObject {
            contents {
              type {
                repr
              }
            }
          }
        }
      }
    }
    events(first: 50) {
      nodes {
        contents {
          type {
            repr
          }
        }
      }
    }
  }
}

query TransactionGasSummary($digest: String!) {
  transaction(digest: $digest) {
    effects {
      gasEffects {
        gasSummary {
          computationCost
          storageCost
          storageRebate
        }
      }
    }
  }
}

query TransactionHistoryByAddress(
  $address: SuiAddress!
  $first: Int!
  $before: String
  $showBalanceChanges: Boolean!
  $showObjectChanges: Boolean!
) {
  transactions(
    last: $first
    before: $before
    filter: { affectedAddress: $address }
  ) {
    pageInfo {
      hasPreviousPage
      startCursor
    }
    nodes {
      ...TransactionHistoryFields
    }
  }
}

query TransactionHistoryBySender(
  $sender: SuiAddress!
  $first: Int!
  $before: String
  $showBalanceChanges: Boolean!
  $showObjectChanges: Boolean!
) {
  transactions(
    last: $first
    before: $before
    filter: { sentAddress: $sender }
  ) {
    pageInfo {
      hasPreviousPage
      startCursor
    }
    nodes {
      ...TransactionHistoryFields
    }
  }
}

query TransactionsByObject(
  $object: SuiAddress!
  $first: Int!
  $after: String
) {
  transactions(
    first: $first
    after: $after
    filter: { affectedObject: $object }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      digest
    }
  }
}

query EpochSummary($epochId: UInt53) {
  epoch(epochId: $epochId) {
    epochId
    referenceGasPrice
    totalTransactions
    startTimestamp
    endTimestamp
  }
}

query ActiveValidators($epochId: UInt53, $first: Int!, $after: String) {
  epoch(epochId: $epochId) {
    validatorSet {
      activeValidators(first: $first, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          contents {
            json
          }
        }
      }
    }
  }
}

query StakedSui($owner: SuiAddress!, $first: Int!, $after: String) {
  address(address: $owner) {
    objects(
      first: $first
      after: $after
      filter: { type: "0x3::staking_pool::StakedSui" }
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        address
        contents {
          json
        }
      }
    }
  }
}

query EventsByModule($module: String!, $first: Int!, $after: String) {
  events(first: $first, after: $after, filter: { module: $module }) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      transactionModule {
        name
      }
      sender {
        address
      }
      contents {
        type {
          repr
        }
        json
      }
    }
  }
}

query ResolveNameServiceAddress($name: String!) {
  address(name: $name) {
    address
  }
}

query GetProtocolConfig {
  protocolConfigs {
    protocolVersion
    configs {
      key
      value
    }
    featureFlags {
      key
      value
    }
  }
}

query ListTransactions(
  $filter: TransactionFilter
  $first: Int
  $after: String
  $last: Int
  $before: String
  $includeEffects: Boolean = false
  $includeEvents: Boolean = false
  $includeBalanceChanges: Boolean = false
  $includeEffectsJson: Boolean = false
  $includeBcs: Boolean = false
) {
  transactions(
    filter: $filter
    first: $first
    after: $after
    last: $last
    before: $before
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      ...CoreTransactionFields
    }
  }
}

query ListEvents(
  $filter: EventFilter
  $first: Int
  $after: String
  $last: Int
  $before: String
) {
  events(
    filter: $filter
    first: $first
    after: $after
    last: $last
    before: $before
  ) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    nodes {
      sequenceNumber
      sender {
        address
      }
      transactionModule {
        name
        package {
          address
        }
      }
      contents {
        type {
          repr
        }
        json
        bcs
      }
      transaction {
        digest
        effects {
          checkpoint {
            sequenceNumber
          }
        }
      }
    }
  }
}

query ResolveTransaction($transaction: JSON!, $doGasSelection: Boolean = true, $checksEnabled: Boolean = true) {
  simulateTransaction(transaction: $transaction, doGasSelection: $doGasSelection, checksEnabled: $checksEnabled) {
    effects {
      transaction {
        transactionBcs
        effects {
          epoch {
            epochId
          }
          status
          executionError {
            message
            abortCode
            identifier
            constant
            sourceLineNumber
            instructionOffset
            module {
              name
              package {
                address
              }
            }
            function {
              name
            }
          }
        }
      }
    }
  }
}
